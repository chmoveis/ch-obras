<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CH Obras</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:100px;
border-radius:10px;
}

h1{
text-align:center;
margin:10px 0;
}

h2{
margin-top:30px;
border-bottom:2px solid #d9a300;
padding-bottom:5px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input, select, textarea{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:linear-gradient(to right,#000,#444);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

button:hover{
opacity:0.9;
}

#assinatura{
border:2px dashed #d9a300;
border-radius:10px;
background:white;
touch-action:none;
width:100%;
height:200px;
}

#historico{
display:none;
margin-top:30px;
padding:15px;
background:#eef8ee;
border:1px solid #9bd09b;
border-radius:10px;
}

.item-relatorio{
border-bottom:1px solid #ccc;
padding:10px 0;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
<img src="logotipo novo atual.jpg">
<h1>CH Obras</h1>
<p>Checklist de Instalação - CH Móveis Sob Medida</p>
</div>

<h2>1. Dados da Obra</h2>

<label>Nome do cliente</label>
<input type="text" id="cliente">

<label>Endereço da obra</label>
<input type="text" id="endereco">

<label>Ambiente</label>
<input type="text" id="ambiente">

<label>Marceneiro responsável</label>
<input type="text" id="marceneiro">

<label>Status da obra</label>
<select id="statusObra">
<option value="">Selecione</option>
<option>A iniciar</option>
<option>Em andamento</option>
<option>Concluída</option>
<option>Com pendência</option>
<option>Aguardando cliente</option>
</select>

<label>Data da instalação</label>
<input type="date" id="data">

<h2>2. Assinatura do Cliente</h2>

<label>Nome do cliente para assinatura</label>
<input type="text" id="nomeClienteAssinatura">

<label>CPF do cliente (opcional)</label>
<input type="text" id="cpfCliente">

<div style="margin-top:20px;">
<canvas id="assinatura"></canvas>
</div>

<button onclick="limparAssinatura()">Limpar Assinatura</button>

<button onclick="salvarChecklist()">Salvar Checklist</button>

<button onclick="mostrarHistorico()">Ver Histórico de Obras</button>

<div id="historico">
<h2>Histórico de Obras</h2>
<div id="listaHistorico"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "SUA_API_KEY",

authDomain: "ch-obras.firebaseapp.com",

projectId: "ch-obras",

storageBucket: "ch-obras.appspot.com",

messagingSenderId: "803401819775",

appId: "1:803401819775:web:39426cb59349b5599a814a"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

window.fazerLogin = async function(){

const email = prompt("Digite seu e-mail:");

const senha = prompt("Digite sua senha:");

try{

await signInWithEmailAndPassword(auth,email,senha);

alert("Login realizado com sucesso.");

}catch(erro){

alert("Erro no login: " + erro.message);

}

}

onAuthStateChanged(auth,(user)=>{

if(!user){

setTimeout(()=>{

fazerLogin();

},500);

}

});

const canvas = document.getElementById("assinatura");

const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;

canvas.height = canvas.offsetHeight;

let desenhando = false;

function pegarPosicao(e){

const rect = canvas.getBoundingClientRect();

if(e.touches){

return {
x:e.touches[0].clientX - rect.left,
y:e.touches[0].clientY - rect.top
};

}else{

return {
x:e.clientX - rect.left,
y:e.clientY - rect.top
};

}

}

function iniciarAssinatura(e){

desenhando = true;

const pos = pegarPosicao(e);

ctx.beginPath();

ctx.moveTo(pos.x,pos.y);

}

function desenharAssinatura(e){

if(!desenhando) return;

e.preventDefault();

const pos = pegarPosicao(e);

ctx.lineTo(pos.x,pos.y);

ctx.strokeStyle = "black";

ctx.lineWidth = 2;

ctx.stroke();

}

function pararAssinatura(){

desenhando = false;

}

canvas.addEventListener("mousedown", iniciarAssinatura);

canvas.addEventListener("mousemove", desenharAssinatura);

canvas.addEventListener("mouseup", pararAssinatura);

canvas.addEventListener("mouseleave", pararAssinatura);

canvas.addEventListener("touchstart", iniciarAssinatura);

canvas.addEventListener("touchmove", desenharAssinatura);

canvas.addEventListener("touchend", pararAssinatura);

window.limparAssinatura = function(){

ctx.clearRect(0,0,canvas.width,canvas.height);

}

window.salvarChecklist = async function(){

const cliente = document.getElementById("cliente").value;

const endereco = document.getElementById("endereco").value;

const ambiente = document.getElementById("ambiente").value;

const marceneiro = document.getElementById("marceneiro").value;

const statusObra = document.getElementById("statusObra").value;

const data = document.getElementById("data").value;

try{

await addDoc(collection(db,"obras"),{

cliente,
endereco,
ambiente,
marceneiro,
statusObra,
data,
criadoEmServidor: serverTimestamp()

});

alert("Checklist salvo na nuvem com sucesso.");

}catch(erro){

alert("Erro ao salvar: " + erro.message);

}

}

window.mostrarHistorico = async function(){

const lista = document.getElementById("listaHistorico");

lista.innerHTML = "<p>Carregando obras...</p>";

try{

const querySnapshot = await getDocs(collection(db,"obras"));

if(querySnapshot.empty){

lista.innerHTML = "<p>Nenhuma obra encontrada.</p>";

document.getElementById("historico").style.display = "block";

return;

}

let html = "";

let contador = 1;

querySnapshot.forEach((doc)=>{

const obra = doc.data();

html += `
<div class="item-relatorio">

<strong>Obra ${contador}</strong><br>

<strong>Cliente:</strong> ${obra.cliente || ""}<br>

<strong>Endereço:</strong> ${obra.endereco || ""}<br>

<strong>Ambiente:</strong> ${obra.ambiente || ""}<br>

<strong>Data:</strong> ${obra.data || ""}<br>

<strong>Marceneiro:</strong> ${obra.marceneiro || ""}<br>

<strong>Status:</strong> ${obra.statusObra || "Não informado"}

</div>
`;

contador++;

});

lista.innerHTML = html;

document.getElementById("historico").style.display = "block";

document.getElementById("historico").scrollIntoView({
behavior:"smooth"
});

}catch(erro){

console.error(erro);

lista.innerHTML = "<p>Erro ao carregar histórico.</p>";

}

}

</script>

</body>
</html>
