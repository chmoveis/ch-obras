  <script>
    function pegarValor(id) {
      return document.getElementById(id).value;
    }

    const canvas = document.getElementById('assinatura');
    const ctx = canvas.getContext('2d');
    let desenhando = false;
    let assinaturaFeita = false;

    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000000';

    function posicao(evento) {
      const rect = canvas.getBoundingClientRect();
      const toque = evento.touches ? evento.touches[0] : evento;
      return {
        x: (toque.clientX - rect.left) * (canvas.width / rect.width),
        y: (toque.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function iniciarAssinatura(evento) {
      evento.preventDefault();
      desenhando = true;
      assinaturaFeita = true;
      const p = posicao(evento);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function desenharAssinatura(evento) {
      if (!desenhando) return;
      evento.preventDefault();
      const p = posicao(evento);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    function pararAssinatura() {
      desenhando = false;
    }

    function limparAssinatura() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      assinaturaFeita = false;
    }

    canvas.addEventListener('mousedown', iniciarAssinatura);
    canvas.addEventListener('mousemove', desenharAssinatura);
    canvas.addEventListener('mouseup', pararAssinatura);
    canvas.addEventListener('mouseleave', pararAssinatura);

    canvas.addEventListener('touchstart', iniciarAssinatura);
    canvas.addEventListener('touchmove', desenharAssinatura);
    canvas.addEventListener('touchend', pararAssinatura);

  
function nomeArquivo(id) {
  const arquivo = document.getElementById(id).files[0];
  return arquivo ? arquivo.name : 'Nenhuma foto selecionada';
}
    function salvarNoHistorico(dados) {
      const historicoAtual = JSON.parse(localStorage.getItem('historicoCHObras')) || [];
      historicoAtual.push(dados);
      localStorage.setItem('historicoCHObras', JSON.stringify(historicoAtual));
    }



   
      
    function gerarPDF() {
      const resultado = document.getElementById('resultado');

      if (resultado.style.display !== 'block') {
        alert('Primeiro clique em Salvar Checklist. Depois gere o relatório.');
        return;
      }

      window.print();
    }
      async function salvarChecklist() {
      const cliente = pegarValor('cliente');
      const fotoPisoUrl = await enviarFotoParaStorage('fotoPiso', 'obras');
      const endereco = pegarValor('endereco');
      const ambiente = pegarValor('ambiente');
      const marceneiro = pegarValor('marceneiro');
      const statusObra = pegarValor('statusObra');
      const data = pegarValor('data');

      if (!cliente || !endereco || !ambiente || !marceneiro || !statusObra || !data) {
        alert('Preencha todos os dados da obra, incluindo o status, antes de salvar.');
        return;
      }

      if (!assinaturaFeita) {
        alert('O cliente precisa assinar antes de salvar o checklist.');
        return;
      }

      const imagemAssinatura = canvas.toDataURL('image/png');

      const checklist = [
        ['Cliente', cliente],
        ['Endereço', endereco],
        ['Ambiente', ambiente],
        ['Marceneiro responsável', marceneiro],
        ['Status da obra', statusObra],
        ['Data da instalação', data],
        ['O piso é de madeira?', pegarValor('pisoMadeira')],
        ['Existe risco ou avaria no piso?', pegarValor('riscoPiso')],
        ['As paredes estão prontas?', pegarValor('paredePronta')],
        ['A parte elétrica está pronta?', pegarValor('eletricaPronta')],
        ['O local está limpo e liberado?', pegarValor('localLimpo')],
        ['As medidas foram conferidas?', pegarValor('medidasConferidas')],
        ['Foto do piso antes da instalação', nomeArquivo('fotoPiso')],
        ['Foto geral do ambiente', nomeArquivo('fotoAmbiente')],
        ['Foto das paredes/local de fixação', nomeArquivo('fotoParede')],
        ['Foto de risco ou avaria', nomeArquivo('fotoAvaria')],
        ['Observações', pegarValor('observacoes') || 'Sem observações'],
        ['Nome de quem assinou', pegarValor('nomeClienteAssinatura') || cliente],
        ['CPF do cliente', pegarValor('cpfCliente') || 'Não informado']
      ];

      let html = '';
      checklist.forEach(function(item) {
        html += '<div class="item-relatorio"><strong>' + item[0] + ':</strong> ' + (item[1] || 'Não informado') + '</div>';
      });

      html += '<div class="item-relatorio"><strong>Assinatura do cliente:</strong><br><img class="assinatura-relatorio" src="' + imagemAssinatura + '" alt="Assinatura do cliente"></div>';

      salvarNoHistorico({
        cliente: cliente,
        endereco: endereco,
        ambiente: ambiente,
        marceneiro: marceneiro,
        statusObra: statusObra,
        data: data,
        criadoEm: new Date().toLocaleString('pt-BR')
      });
      salvarObraNaNuvem({
  cliente: cliente,
  fotoPisoUrl: fotoPisoUrl,      
  endereco: endereco,
  ambiente: ambiente,
  marceneiro: marceneiro,
  statusObra: statusObra,
  data: data
});
      document.getElementById('relatorio').innerHTML = html;
      document.getElementById('resultado').style.display = 'block';
      document.getElementById('resultado').scrollIntoView({ behavior: 'smooth' });
    }
  </script>

window.mostrarHistorico = async function() {

  const lista = document.getElementById('listaHistorico');

  lista.innerHTML = '<p>Carregando obras...</p>';

  document.getElementById('historico').style.display = 'block';

  try {

    const querySnapshot = await getDocs(collection(db, "obras"));

    if (querySnapshot.empty) {

      lista.innerHTML = '<p>Nenhuma obra encontrada.</p>';

      return;

    }

    let html = '';

    let contador = 1;

    querySnapshot.forEach((doc) => {

      const obra = doc.data();

      html += `
      <div class="item-relatorio">

      <strong>Obra ${contador}</strong><br>

      <strong>Cliente:</strong> ${obra.cliente || ''}<br>

      <strong>Endereço:</strong> ${obra.endereco || ''}<br>

      <strong>Ambiente:</strong> ${obra.ambiente || ''}<br>

      <strong>Data:</strong> ${obra.data || ''}<br>

      <strong>Marceneiro:</strong> ${obra.marceneiro || ''}<br>

      <strong>Status:</strong> 
<span class="
${obra.statusObra === 'Concluída' ? 'status status-concluida' : ''}
${obra.statusObra === 'Em andamento' ? 'status status-andamento' : ''}
${obra.statusObra === 'Com pendência' ? 'status status-pendencia' : ''}
${obra.statusObra === 'A iniciar' ? 'status status-iniciar' : ''}
${obra.statusObra === 'Aguardando cliente' ? 'status status-cliente' : ''}
">
${obra.statusObra || 'Não informado'}
</span><br>

      <strong>Criado em:</strong> ${obra.criadoEm || ''}<br>
${obra.fotoPisoUrl ? `
<br>
<img src="${obra.fotoPisoUrl}" 
style="width:100%; border-radius:10px; margin-top:10px; border:2px solid #ccc;">
<br>
` : ''}
<button 
  type="button" 
  onclick="excluirObra('${doc.id}')" 
  class="botao-excluir">
  Excluir Obra
</button>

      </div>
      `;

      contador++;

    });

    lista.innerHTML = html;

  } catch (erro) {

    console.error(erro);

    lista.innerHTML = '<p>Erro ao carregar histórico.</p>';

  }
});
}

window.filtrarHistorico = function() {
  const texto = document
    .getElementById('buscaHistorico')
    .value
    .toLowerCase();

  const statusFiltro = document
    .getElementById('filtroStatus')
    .value
    .toLowerCase();

  const itens = document.querySelectorAll('.item-relatorio');

  itens.forEach((item) => {
    const conteudo = item.innerText.toLowerCase();

    const passaTexto = conteudo.includes(texto);
    const passaStatus = !statusFiltro || conteudo.includes(statusFiltro);

    if (passaTexto && passaStatus) {
      item.style.display = 'block';
    } else {
      item.style.display = 'none';
    }
  });
};


});
}

window.enviarFotoParaStorage = async function(inputId, nomePasta) {
  const input = document.getElementById(inputId);

  if (!input || !input.files || input.files.length === 0) {
    return "";
  }

  const arquivo = input.files[0];
  const nomeArquivo = Date.now() + "-" + arquivo.name;
  const caminho = nomePasta + "/" + nomeArquivo;

  const referenciaArquivo = ref(storage, caminho);

  await uploadBytes(referenciaArquivo, arquivo);

  const urlDownload = await getDownloadURL(referenciaArquivo);

  return urlDownload;
};
